services:
    web:
        image: mab:2.0
        build:
            target: web
            context: .
        env_file:
            - .env
        ports:
            - "8091:80"
        volumes:
            - .:/var/www/html
            - ./storage:/var/www/html/storage
        networks:
            - app-network

networks:
    app-network:
        driver: bridge
