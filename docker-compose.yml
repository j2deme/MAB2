services:
    web:
        image: mab:2.0
        build:
            target: web
            context: .
        env_file:
            - .env
        ports:
            - "8091:80"
        volumes:
            - .:/var/www/html
            - ./storage:/var/www/html/storage
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost/health"]
            interval: 5s
            timeout: 3s
            retries: 5
            start_period: 10s
        networks:
            - app-network

networks:
    app-network:
        driver: bridge
